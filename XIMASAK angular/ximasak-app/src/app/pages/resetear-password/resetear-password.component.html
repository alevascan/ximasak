<div class="reset-container">
  <div class="reset-card">
    <div class="reset-header">
      <div class="logo-circle">🔒</div>
      <h2>Restablecer Contraseña</h2>
      <p class="subtitle">Ingresa tu nueva contraseña para recuperar el acceso a Ximasak EIRL</p>
    </div>

    <div *ngIf="mensajeExito" class="alert alert-success">
      ✓ {{ mensajeExito }}
    </div>

    <div *ngIf="mensajeError" class="alert alert-danger">
      ⚠ {{ mensajeError }}
    </div>

    <form (ngSubmit)="cambiarPassword()" *ngIf="!mensajeExito">
      <div class="form-group">
        <label for="nuevaPass">Nueva Contraseña</label>
        <input 
          id="nuevaPass" 
          type="password" 
          [(ngModel)]="nuevaPassword" 
          name="nuevaPassword" 
          placeholder="Mínimo 4 caracteres" 
          required 
          class="form-control"
        />
      </div>

      <div class="form-group">
        <label for="confPass">Confirmar Nueva Contraseña</label>
        <input 
          id="confPass" 
          type="password" 
          [(ngModel)]="confirmarPassword" 
          name="confirmarPassword" 
          placeholder="Repite la contraseña" 
          required 
          class="form-control"
        />
      </div>

      <button type="submit" class="btn-submit" [disabled]="cargando || !token">
        {{ cargando ? 'Actualizando...' : 'Guardar Nueva Contraseña' }}
      </button>
    </form>

    <div class="reset-footer">
      <a routerLink="/" class="link-back">← Volver al Inicio</a>
    </div>
  </div>
</div>
